<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Packages ✈️</title>
<style>
body{font-family:'Segoe UI',Arial;margin:0;background:linear-gradient(135deg,#a8edea,#fed6e3);min-height:100vh}
header{background:linear-gradient(90deg,#6a11cb,#2575fc);color:white;padding:20px;text-align:center}
header h1{margin:0}
.search{margin:15px;text-align:center}
.search input{padding:10px 15px;border-radius:20px;border:2px solid #6a11cb;width:300px;max-width:80vw;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:20px}
.card{background:white;border-radius:18px;width:300px;box-shadow:0 8px 25px rgba(0,0,0,0.2);overflow:hidden}
.top{height:160px;display:flex;align-items:center;justify-content:center;color:white;overflow:hidden}
.top img{width:100%;height:160px;object-fit:cover}
.body{padding:15px;text-align:center}
.price{color:#2e7d32;font-weight:bold;font-size:18px}
.meta{font-size:13px;color:#555;background:#f5f5f5;border-radius:10px;padding:8px;margin:8px 0;text-align:left}
.rating{color:#ff9800;font-weight:bold}
button{background:linear-gradient(90deg,#ff758c,#ff7eb3);color:white;border:none;border-radius:20px;padding:10px 25px;cursor:pointer;font-size:15px;margin-top:8px}
button:hover{transform:scale(1.05)}
.book{background:white;margin:20px auto;padding:20px;border-radius:18px;width:350px;max-width:90vw;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,0.2)}
.book input,.book select{width:90%;padding:9px;margin:6px;border-radius:10px;border:1px solid #aaa}
#msg{color:green;font-weight:bold}
#blist{font-size:14px;color:#555}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:10;justify-content:center;align-items:center}
.popup{background:white;border-radius:20px;padding:25px;width:400px;max-width:90vw;max-height:85vh;overflow:auto;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.popup h2{margin-top:0;color:#4a148c;text-align:center}
.popup img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.close{background:#ff5252;color:white;border:none;border-radius:20px;padding:8px 25px;cursor:pointer;font-size:15px;display:block;margin:15px auto 0}
</style></head>
<body>
<header><h1>✈️ South India Tours</h1><p>12 famous places • Hotels + Bus included • Find + Book</p><p><a href="/admin.html" style="color:#ffeb3b">📋 Admin: View all bookings</a></p></header>
<div class="search"><input id="q" placeholder="Search Goa, Coorg, temple, beach..." oninput="render()"></div>
<div class="grid" id="grid"></div>
<div class="modal" id="modal" onclick="if(event.target==this)closePop()"><div class="popup" id="pop"></div></div>
<div class="book">
<h3>📝 Book Tour</h3>
<select id="tour" onchange="calc()"></select><br>
<input id="name" placeholder="Your name"><br>
<label>?? Trip Date:</label><br><input id="date" type="date"><br>
<input id="people" type="number" min="1" value="2" oninput="calc()"><br>
<p id="total" style="font-weight:bold;color:#4a148c"></p>
<button onclick="book()">Book Now</button>
<p id="msg"></p>
<h4>My Bookings:</h4><div id="blist">-</div>
</div>
<script>
let tours=[];
async function load(){
  let r=await fetch('/api/tours'); tours=await r.json();
  let sel=document.getElementById('tour');
  sel.innerHTML=tours.map(t=>`<option value="${t.id}">${t.name} - Rs.${t.price}/person</option>`).join('');
  render(); loadBookings(); calc();
}
function render(){
  let q=document.getElementById('q').value.toLowerCase();
  let f=tours.filter(t=>(t.name+t.destination+t.category+t.hotel+t.state).toLowerCase().includes(q));
  let states=[...new Set(f.map(t=>t.state))];
  document.getElementById('grid').innerHTML=states.map(s=>{
    let cards=f.filter(t=>t.state==s).map(t=>`
     <div class="card" onclick="detail(${t.id})" style="cursor:pointer"><div class="top"><img src="${t.imageUrl}" alt="${t.destination}" loading="lazy" onerror="this.style.display='none'"></div>
     <div class="body"><h3>${t.name}</h3><p>📍 ${t.destination} • ${t.category} • <span class="rating">⭐ ${t.rating}</span></p>
     <p class="price">Rs. ${t.price} <small>/person</small></p><p style="font-size:13px;color:#333">?? Trip: ${t.tripDate}</p>
     <div class="meta">🏨 ${t.hotel}<br>🚌 ${t.bus}</div>
     <p style="color:#6a11cb;font-size:13px">Click to see places + resorts 👆</p></div></div>`).join('');
    return `<div style="width:100%;text-align:center"><h2 style="color:#4a148c;margin:20px 0 5px">📍 ${s}</h2><div style="display:flex;flex-wrap:wrap;gap:20px;justify-content:center">${cards}</div></div>`;
  }).join('')||'<p>No tours found</p>';
}
async function detail(id){
  let r=await fetch('/api/tours/'+id); let t=await r.json();
  document.getElementById('pop').innerHTML=`
    <h2>📍 ${t.name}</h2>
    <img src="${t.imageUrl}" onerror="this.style.display='none'">
    <p>📍 ${t.destination}, ${t.state} • ${t.category} • ⭐ ${t.rating} • <b style="color:green">Rs.${t.price} /person</b></p>
    <p><b>🌟 Famous places:</b><br>✅ ${t.places.split(',').join('<br>✅ ')}</p>
    <p><b>🏨 Top resorts:</b><br>🏨 ${t.resorts.split(',').join('<br>🏨 ')}</p>
    <p>🚌 ${t.bus}</p>
    <button class="close" onclick="closePop()">Close ✖</button>`;
  document.getElementById('modal').style.display='flex';
}
function closePop(){document.getElementById('modal').style.display='none';}
function calc(){
  let id=document.getElementById('tour').value;
  let t=tours.find(x=>x.id==id);
  let n=Number(document.getElementById('people').value||1);
  if(t) document.getElementById('total').innerText=`👥 ${n} people x Rs.${t.price} = Total Rs.${t.price*n}`;
}
async function book(){
  let tourId=document.getElementById('tour').value;
  let name=document.getElementById('name').value;
  let date=document.getElementById('date').value;
  let n=Number(document.getElementById('people').value||1);
  if(!name||!date){alert('Enter name and date');return;}
  let t=tours.find(x=>x.id==tourId);
  let total=t?t.price*n:0;
  let r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({tourId:Number(tourId),name,date,numPeople:n,totalAmount:total})});
  let b=await r.json();
  document.getElementById('msg').innerText=`✅ Booked! ID: ${b.id} Total Rs.${b.totalAmount}`;
  loadBookings();
}
async function loadBookings(){
  let r=await fetch('/api/bookings'); let list=await r.json();
  document.getElementById('blist').innerHTML=list.length?list.map(b=>`#${b.id} ${b.name} - Tour ${b.tourId} x ${b.numPeople} = Rs.${b.totalAmount} on ${b.date}`).join('<br>'):'-';
}
load();
</script>
</body></html>
